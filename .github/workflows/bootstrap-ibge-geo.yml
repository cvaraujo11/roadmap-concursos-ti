name: Bootstrap IBGE geography

on:
  push:
    branches:
      - fix/m5-malha-ibge-local
    paths:
      - scripts/update-ibge-states.mjs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-malha-ibge-local
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate local IBGE state mesh
        run: node scripts/update-ibge-states.mjs
      - name: Commit generated snapshot
        run: |
          if [ -z "$(git status --porcelain -- public/data/maps)" ]; then
            echo "No map data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/maps
          git commit -m "data: vendoriza malha mínima de UFs do IBGE"
          git push origin HEAD:fix/m5-malha-ibge-local
